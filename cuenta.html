<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Mar</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="logo-dark.png" />
</head>
<body>
  <div class="page">
    <div class="topbar"><a class="back" href="index.html">← Inicio</a></div>
    <section class="inner">
      <h1>Login</h1>
      <p class="lead">Entrá para modificar la estética del sitio.</p>
      <form id="form-cuenta">
        <div class="form-grid">
          <div class="field full">
            <label for="usuario">Usuario</label>
            <input id="usuario" required placeholder="usuario" />
          </div>
          <div class="field full">
            <label for="clave">Contraseña</label>
            <input id="clave" type="password" required placeholder="••••" />
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-submit" type="submit">Ingresar</button>
        </div>
        <div class="toast" id="toast-cuenta">Usuario o contraseña incorrectos.</div>
      </form>
    </section>
  </div>
  <script src="theme.js"></script>
  <script>
    if (isLogged()) window.location.href = "index.html";
    document.getElementById("form-cuenta").addEventListener("submit", (e) => {
      e.preventDefault();
      const user = document.getElementById("usuario").value.trim();
      const pass = document.getElementById("clave").value;
      if (login(user, pass)) window.location.href = "index.html";
      else document.getElementById("toast-cuenta").classList.add("show");
    });
  </script>
</body>
</html>
