<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mar | Terapia y Medicina Herbal</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="logo.png" />
</head>
<body>
  <main class="landing">
    <div class="logo-wrap" id="logoWrap">
      <img src="logo.png" alt="Mar" />
      <div class="logo-caption">Terapia & Medicina Herbal</div>
    </div>

    <div class="actions">
      <a class="pill pill-dark" href="turno.html">
        <b>Agendá tu turno</b>
        <small>Primera consulta o seguimiento</small>
      </a>
      <a class="pill pill-light" href="cuenta.html">
        <b>Ingresá a tu cuenta</b>
        <small>Consultá o modificá turnos</small>
      </a>
    </div>

    <a class="login-only" href="cuenta.html">Login</a>
  </main>

  <script src="theme.js"></script>
  <script>
    const wrap = document.getElementById("logoWrap");
    if (isLogged()) {
      wrap.classList.add("draggable");
      let dragging = false;
      wrap.addEventListener("pointerdown", (e) => {
        dragging = true;
        wrap.classList.add("dragging");
        wrap.setPointerCapture(e.pointerId);
      });
      wrap.addEventListener("pointerup", () => {
        dragging = false;
        wrap.classList.remove("dragging");
      });
      wrap.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const theme = getTheme();
        theme.logoX = Math.max(8, Math.min(92, (e.clientX / window.innerWidth) * 100));
        theme.logoY = Math.max(2, Math.min(70, (e.clientY / window.innerHeight) * 100));
        saveTheme(theme);
      });
    }
  </script>
</body>
</html>
