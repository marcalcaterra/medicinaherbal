<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mar | Terapia y Medicina Herbal</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body.home {
      font-family: Nunito, "Segoe UI", sans-serif;
      background: #96ab82 !important;
      overflow: hidden;
      color: #2c4a38;
    }
    body.home::before { display: none !important; }
    .bloom { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .bouquet {
      position: absolute; left: 50%; top: 42%;
      width: min(780px, 92vw);
      transform: translate(-50%, -50%);
      opacity: 0;
      animation: formBouquet 2.4s ease forwards, floatBouquet 12s ease-in-out 2.4s infinite;
    }
    .fly, .flowers, .flo, .flower { display: none !important; }
    .stage {
      position: relative; z-index: 5; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding: 6vh 16px 8vh; box-sizing: border-box;
    }
    .home .logo-wrap {
      position: absolute !important; left: 50% !important; top: 11% !important;
      width: min(280px, 58vw) !important; transform: translateX(-50%) !important;
    }
    .home .logo-wrap img { width: 100%; height: auto; display: block; }
    .cta { width: min(540px, 92vw); display: grid; gap: 14px; margin-bottom: 26px; }
    .btn-main {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 58px; padding: 10px 16px; text-decoration: none; text-align: center; border-radius: 2px;
    }
    .btn-main b { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
    .btn-main small { font-size: 11px; opacity: .85; margin-top: 2px; }
    .btn-main.dark { background: #2c4a38; color: #fff; }
    .btn-main.light { background: #fff; color: #2c4a38; }
    .login-pill { text-decoration: none; background: #fff; color: #6f8464; border-radius: 999px; padding: 8px 28px; font-weight: 700; }
    .editor {
      display: none !important; position: fixed !important; top: 16px !important; right: 16px !important;
      left: auto !important; width: 250px !important; max-width: 250px !important;
      background: #fff !important; border-radius: 16px !important; padding: 14px !important; z-index: 80 !important;
      box-shadow: 0 12px 28px rgba(0,0,0,.16) !important;
    }
    body.is-admin .editor { display: block !important; }
    .editor .ed-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 12px; font-weight: 700; }
    .editor input[type="color"] { width: 42px !important; height: 28px !important; max-width: 42px !important; padding: 0 !important; }
    .editor input, .editor select { width: 120px !important; max-width: 120px !important; height: 28px !important; }
    .editor .ed-row.col { flex-direction: column; align-items: stretch; }
    .bot-mar { display: none !important; }
    @keyframes formBouquet {
      0% { opacity: 0; transform: translate(-50%, -46%) scale(.96); }
      100% { opacity: .55; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes floatBouquet {
      0%,100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, -51.5%); }
    }
  </style>
</head>
<body class="home">
  <div class="bloom">
    <img class="bouquet" src="bouquet.png" alt="" />
  </div>
  <aside class="editor" id="editor">
    <h2>Editar en vivo</h2>
    <p>Los cambios se ven en esta misma página.</p>
    <div class="ed-row"><span>Fondo</span><input id="bg" type="color" /></div>
    <div class="ed-row"><span>Botón Agendá</span><input id="btn1" type="color" /></div>
    <div class="ed-row"><span>Botón Ingresá</span><input id="btn2" type="color" /></div>
    <div class="ed-row"><span>Login</span><input id="login" type="color" /></div>
    <div class="ed-actions">
      <button type="button" id="reset">Restablecer</button>
      <a href="#" id="salir">Salir</a>
    </div>
  </aside>
  <main class="stage">
    <div class="logo-wrap" id="logoWrap">
      <img src="logo.png" alt="Mar" />
    </div>
    <div class="cta">
      <a class="btn-main dark" href="turno.html">
        <b>Agendá tu turno</b>
        <small>Primera consulta o seguimiento</small>
      </a>
      <a class="btn-main light" href="cuenta.html">
        <b>Ingresá a tu cuenta</b>
        <small>Consultá o modificá turnos</small>
      </a>
    </div>
    <a class="login-pill" href="cuenta.html">Login</a>
  </main>
  <script src="theme.js"></script>
</body>
</html>
