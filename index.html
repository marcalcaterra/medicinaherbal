<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mar | Terapia y Medicina Herbal</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body.home {
      font-family: Nunito, "Segoe UI", sans-serif;
      background: #96ab82 !important;
      overflow: hidden;
      color: #2c4a38;
    }
    body.home::before { display: none !important; }
    .bloom {
      position: fixed; left: 50%; top: 40%;
      width: min(640px, 88vw); height: 70vh;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 1;
    }
    .branch {
      position: absolute; bottom: 0; opacity: 0;
      transform-origin: 50% 100%;
      animation: appear .9s ease forwards;
    }
    .b1 { left: 2%; height: 78%; animation-delay: .1s; animation-name: appear, sway1; animation-duration: .9s, 6s; animation-timing-function: ease, ease-in-out; animation-iteration-count: 1, infinite; animation-delay: .05s, 1s; }
    .b2 { left: 18%; height: 88%; animation-name: appear, sway2; animation-duration: .9s, 7s; animation-timing-function: ease, ease-in-out; animation-iteration-count: 1, infinite; animation-delay: .15s, 1.1s; }
    .b3 { left: 38%; height: 94%; animation-name: appear, sway3; animation-duration: .9s, 8s; animation-timing-function: ease, ease-in-out; animation-iteration-count: 1, infinite; animation-delay: .25s, 1.2s; }
    .b4 { left: 56%; height: 84%; animation-name: appear, sway2; animation-duration: .9s, 6.5s; animation-timing-function: ease, ease-in-out; animation-iteration-count: 1, infinite; animation-delay: .2s, 1.15s; }
    .b5 { left: 74%; height: 72%; animation-name: appear, sway1; animation-duration: .9s, 7.4s; animation-timing-function: ease, ease-in-out; animation-iteration-count: 1, infinite; animation-delay: .3s, 1.3s; }
    .branch img { height: 100%; width: auto; display: block; }
    .fly, .flowers, .flo, .flower, .bot-mar { display: none !important; }

    .stage { position: relative; z-index: 5; min-height: 100vh; }
    .box {
      position: absolute;
      box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
    }
    body.is-admin .box { outline: 1px dashed rgba(44,74,56,.45); cursor: grab; }
    body.is-admin .box.dragging { cursor: grabbing; outline-color: #2c4a38; }
    #box-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .btn-main {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-decoration: none; text-align: center;
    }
    .btn-main b { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
    .btn-main small { font-size: 11px; opacity: .85; margin-top: 2px; }
    .btn-main.dark { background: var(--btn1, #2c4a38); color: #fff; }
    .btn-main.light { background: var(--btn2, #fff); color: var(--btn1, #2c4a38); }
    .login-pill {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; background: var(--login, #fff); color: #6f8464;
      border-radius: 999px; font-weight: 700;
    }

    .editor {
      display: none !important; position: fixed !important; top: 12px !important; right: 12px !important;
      width: 270px !important; max-height: calc(100vh - 24px); overflow: auto;
      background: #fff !important; border-radius: 16px !important; padding: 14px !important; z-index: 80 !important;
      box-shadow: 0 12px 28px rgba(0,0,0,.16) !important;
    }
    body.is-admin .editor { display: block !important; }
    .editor h2 { font-size: 16px; margin: 0 0 6px; }
    .editor p, .editor h3 { font-size: 12px; margin: 10px 0 6px; }
    .editor .ed-row { display: flex; justify-content: space-between; align-items: center; margin: 7px 0; font-size: 12px; font-weight: 700; }
    .editor .ed-row.col { flex-direction: column; align-items: stretch; gap: 4px; }
    .editor input[type="color"] { width: 42px !important; height: 28px !important; max-width: 42px !important; padding: 0 !important; }
    .editor input, .editor select { width: 120px !important; max-width: 120px !important; height: 28px !important; }
    .editor input[type="range"] { width: 100% !important; max-width: 100% !important; }
    @keyframes appear { from { opacity: 0; transform: translateY(16px); } to { opacity: .7; transform: none; } }
    @keyframes sway1 { 0%,100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.6deg); } }
    @keyframes sway2 { 0%,100% { transform: rotate(1.2deg); } 50% { transform: rotate(-1.8deg); } }
    @keyframes sway3 { 0%,100% { transform: rotate(-.6deg); } 50% { transform: rotate(1.1deg); } }
  </style>
</head>
<body class="home">
  <div class="bloom">
    <div class="branch b1"><img src="branch-1.png" alt="" /></div>
    <div class="branch b2"><img src="branch-2.png" alt="" /></div>
    <div class="branch b3"><img src="branch-3.png" alt="" /></div>
    <div class="branch b4"><img src="branch-4.png" alt="" /></div>
    <div class="branch b5"><img src="branch-5.png" alt="" /></div>
  </div>

  <aside class="editor" id="editor">
    <h2>Editar en vivo</h2>
    <p>Arrastrá los recuadros o usá los controles.</p>
    <div class="ed-row"><span>Fondo</span><input id="bg" type="color" /></div>
    <div class="ed-row"><span>Botón Agendá</span><input id="btn1" type="color" /></div>
    <div class="ed-row"><span>Botón Ingresá</span><input id="btn2" type="color" /></div>
    <div class="ed-row"><span>Login</span><input id="loginColor" type="color" /></div>
    <h3>Recuadro</h3>
    <div class="ed-row">
      <span>Cuál</span>
      <select id="boxName">
        <option value="logo">Logo</option>
        <option value="turno">Agendá tu turno</option>
        <option value="cuenta">Ingresá a tu cuenta</option>
        <option value="login">Login</option>
      </select>
    </div>
    <div class="ed-row col"><span>Posición X</span><input id="boxX" type="range" min="8" max="92" /></div>
    <div class="ed-row col"><span>Posición Y</span><input id="boxY" type="range" min="4" max="92" /></div>
    <div class="ed-row col"><span>Ancho</span><input id="boxW" type="range" min="80" max="700" /></div>
    <div class="ed-row col"><span>Alto</span><input id="boxH" type="range" min="36" max="360" /></div>
    <div class="ed-actions">
      <button type="button" id="reset">Restablecer</button>
      <a href="#" id="salir">Salir</a>
    </div>
  </aside>

  <main class="stage">
    <div class="box" id="box-logo" data-box="logo"><img src="logo.png" alt="Mar" /></div>
    <a class="box btn-main dark" id="box-turno" data-box="turno" href="turno.html">
      <b>Agendá tu turno</b>
      <small>Primera consulta o seguimiento</small>
    </a>
    <a class="box btn-main light" id="box-cuenta" data-box="cuenta" href="cuenta.html">
      <b>Ingresá a tu cuenta</b>
      <small>Consultá o modificá turnos</small>
    </a>
    <a class="box login-pill" id="box-login" data-box="login" href="cuenta.html">Login</a>
  </main>
  <script src="theme.js"></script>
</body>
</html>
