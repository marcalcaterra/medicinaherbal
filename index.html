<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mar | Terapia y Medicina Herbal</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Nunito, "Segoe UI", sans-serif;
      background: #96ab82;
      overflow: hidden;
      color: #2c4a38;
    }
    .bloom {
      position: fixed;
      left: 50%;
      top: 38%;
      width: min(620px, 86vw);
      height: 68vh;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }
    .branch {
      position: absolute;
      bottom: 0;
      opacity: 0;
      animation: fadeIn .8s ease forwards;
    }
    .branch img {
      height: 100%;
      width: auto;
      display: block;
      transform-origin: 50% 100%;
      will-change: transform;
    }
    .b1 { left: 0; height: 80%; animation-delay: .05s; }
    .b2 { left: 18%; height: 90%; animation-delay: .12s; }
    .b3 { left: 36%; height: 96%; animation-delay: .18s; }
    .b4 { left: 54%; height: 86%; animation-delay: .14s; }
    .b5 { left: 72%; height: 74%; animation-delay: .22s; }
    .b1 img { animation: swayA 6.2s ease-in-out 1s infinite; }
    .b2 img { animation: swayB 7s ease-in-out 1.1s infinite; }
    .b3 img { animation: swayC 8s ease-in-out 1.2s infinite; }
    .b4 img { animation: swayB 6.6s ease-in-out 1.15s infinite; }
    .b5 img { animation: swayA 7.4s ease-in-out 1.25s infinite; }

    .stage { position: relative; z-index: 5; min-height: 100vh; }
    .box {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, 0);
      transition: left .25s ease, top .25s ease, width .25s ease, height .25s ease;
    }
    body.is-admin .box { outline: 1px dashed rgba(44,74,56,.4); cursor: grab; transition: none; }
    body.is-admin .box.dragging { cursor: grabbing; outline-color: #2c4a38; }
    #box-logo { left: 50%; top: 10%; width: 260px; height: 210px; }
    #box-logo img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
    #box-turno { left: 50%; top: 68%; width: min(520px, 92vw); height: 58px; }
    #box-cuenta { left: 50%; top: 78%; width: min(520px, 92vw); height: 58px; }
    #box-login { left: 50%; top: 90%; width: 120px; height: 38px; }
    .btn-main {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-decoration: none; text-align: center;
    }
    .btn-main b { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
    .btn-main small { font-size: 11px; opacity: .85; margin-top: 2px; }
    .btn-main.dark { background: var(--btn1, #2c4a38); color: #fff; }
    .btn-main.light { background: var(--btn2, #fff); color: var(--btn1, #2c4a38); }
    .login-pill {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; background: var(--login, #fff); color: #6f8464;
      border-radius: 999px; font-weight: 700;
    }
    .editor {
      display: none;
      position: fixed; top: 12px; right: 12px;
      width: 270px; max-height: calc(100vh - 24px); overflow: auto;
      background: #fff; border-radius: 16px; padding: 14px; z-index: 80;
      box-shadow: 0 12px 28px rgba(0,0,0,.16);
    }
    body.is-admin .editor { display: block; }
    .editor h2 { font-size: 16px; margin: 0 0 6px; }
    .editor p, .editor h3 { font-size: 12px; margin: 10px 0 6px; }
    .editor .ed-row { display: flex; justify-content: space-between; align-items: center; margin: 7px 0; font-size: 12px; font-weight: 700; }
    .editor .ed-row.col { flex-direction: column; align-items: stretch; gap: 4px; }
    .editor input[type="color"] { width: 42px; height: 28px; padding: 0; border: 0; background: none; }
    .editor input, .editor select { width: 120px; height: 28px; }
    .editor input[type="range"] { width: 100%; }
    .editor button, .editor a { font-size: 13px; font-weight: 800; color: #2c4a38; margin-right: 8px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: .72; } }
    @keyframes swayA { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.7deg); } }
    @keyframes swayB { 0%,100% { transform: rotate(1.3deg); } 50% { transform: rotate(-1.8deg); } }
    @keyframes swayC { 0%,100% { transform: rotate(-.5deg); } 50% { transform: rotate(1.2deg); } }
  </style>
</head>
<body>
  <div class="bloom">
    <div class="branch b1"><img src="branch-1.png" alt="" /></div>
    <div class="branch b2"><img src="branch-2.png" alt="" /></div>
    <div class="branch b3"><img src="branch-3.png" alt="" /></div>
    <div class="branch b4"><img src="branch-4.png" alt="" /></div>
    <div class="branch b5"><img src="branch-5.png" alt="" /></div>
  </div>

  <aside class="editor" id="editor">
    <h2>Editar en vivo</h2>
    <p>Arrastrá los recuadros o usá los controles.</p>
    <div class="ed-row"><span>Fondo</span><input id="bg" type="color" /></div>
    <div class="ed-row"><span>Botón Agendá</span><input id="btn1" type="color" /></div>
    <div class="ed-row"><span>Botón Ingresá</span><input id="btn2" type="color" /></div>
    <div class="ed-row"><span>Login</span><input id="loginColor" type="color" /></div>
    <h3>Recuadro</h3>
    <div class="ed-row">
      <span>Cuál</span>
      <select id="boxName">
        <option value="logo">Logo</option>
        <option value="turno">Agendá tu turno</option>
        <option value="cuenta">Ingresá a tu cuenta</option>
        <option value="login">Login</option>
      </select>
    </div>
    <div class="ed-row col"><span>Posición X</span><input id="boxX" type="range" min="8" max="92" /></div>
    <div class="ed-row col"><span>Posición Y</span><input id="boxY" type="range" min="4" max="92" /></div>
    <div class="ed-row col"><span>Ancho</span><input id="boxW" type="range" min="80" max="700" /></div>
    <div class="ed-row col"><span>Alto</span><input id="boxH" type="range" min="36" max="360" /></div>
    <div class="ed-actions">
      <button type="button" id="reset">Restablecer</button>
      <a href="#" id="salir">Salir</a>
    </div>
  </aside>

  <main class="stage">
    <div class="box" id="box-logo" data-box="logo"><img src="logo.png" alt="Mar" /></div>
    <a class="box btn-main dark" id="box-turno" data-box="turno" href="turno.html">
      <b>Agendá tu turno</b>
      <small>Primera consulta o seguimiento</small>
    </a>
    <a class="box btn-main light" id="box-cuenta" data-box="cuenta" href="cuenta.html">
      <b>Ingresá a tu cuenta</b>
      <small>Consultá o modificá turnos</small>
    </a>
    <a class="box login-pill" id="box-login" data-box="login" href="cuenta.html">Login</a>
  </main>
  <script src="theme.js"></script>
</body>
</html>
