<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mar | Terapia y Medicina Herbal</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="logo-dark.png" />
</head>
<body>
  <main class="wrap">
    <section class="card logo-card">
      <div class="logo-wrap" id="logoWrap">
        <img src="logo-dark.png" alt="Mar Terapia y Medicina Herbal" />
      </div>
    </section>

    <section class="actions">
      <a class="pill pill-dark" href="turno.html">
        <b>Agendá tu turno</b>
        <small>Primera consulta o seguimiento</small>
      </a>
      <a class="pill pill-light" href="cuenta.html">
        <b>Ingresá a tu cuenta</b>
        <small>Consultá o modificá turnos</small>
      </a>
    </section>

    <a class="login-bar" href="cuenta.html">Login</a>
  </main>

  <script src="theme.js"></script>
  <script>
    const wrap = document.getElementById("logoWrap");
    if (isLogged()) {
      wrap.classList.add("draggable");
      let dragging = false;
      wrap.addEventListener("pointerdown", (e) => {
        dragging = true;
        wrap.classList.add("dragging");
        wrap.setPointerCapture(e.pointerId);
      });
      wrap.addEventListener("pointerup", () => {
        dragging = false;
        wrap.classList.remove("dragging");
      });
      wrap.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const card = wrap.parentElement.getBoundingClientRect();
        const theme = getTheme();
        theme.logoX = Math.max(10, Math.min(90, ((e.clientX - card.left) / card.width) * 100));
        theme.logoY = Math.max(10, Math.min(90, ((e.clientY - card.top) / card.height) * 100));
        saveTheme(theme);
      });
    }
  </script>
</body>
</html>
